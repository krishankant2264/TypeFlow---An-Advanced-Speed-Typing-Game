<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; display: grid; place-items: center; min-height: 100vh; }
    .box { background: white; padding: 25px; border-radius: 12px; width: min(90%, 360px); box-shadow: 0 4px 15px #0002; }
    input, button { width: 100%; padding: 11px; margin: 8px 0; box-sizing: border-box; }
    button { background: #1769aa; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #result { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>BMI Calculator</h2>
    <label>Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter your weight" min="1" step="any">
    <label>Height (cm)</label>
    <input type="number" id="height" placeholder="Enter your height in cm" min="1" step="any">
    <button onclick="calculateBMI()">Calculate BMI</button>
    <p id="result" aria-live="polite"></p>
  </div>

  <script>
    function calculateBMI() {
      const weight = Number(document.getElementById("weight").value);
      const heightCm = Number(document.getElementById("height").value);
      const result = document.getElementById("result");

      if (weight <= 0 || heightCm <= 0) {
        result.textContent = "Please enter a valid weight and height.";
        return;
      }

      const heightM = heightCm / 100;
      const bmi = weight / (heightM * heightM);
      let category;

      if (bmi < 18.5) {
        category = "Underweight";
      } else if (bmi < 25) {
        category = "Normal";
      } else {
        category = "Overweight";
      }

      result.textContent = "Your BMI is " + bmi.toFixed(2) + " — " + category;
    }
  </script>
</body>
</html>
