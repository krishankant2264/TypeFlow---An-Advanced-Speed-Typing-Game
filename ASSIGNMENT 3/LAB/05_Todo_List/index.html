<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; display: grid; place-items: start center; min-height: 100vh; padding-top: 40px; }
    .box { background: white; padding: 25px; width: min(90%, 420px); border-radius: 12px; box-shadow: 0 4px 15px #0002; }
    .entry { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px; }
    button { padding: 10px 13px; border: 0; border-radius: 5px; cursor: pointer; background: #1769aa; color: white; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.completed span { text-decoration: line-through; color: gray; }
    .delete { background: #c62828; }
  </style>
</head>
<body>
  <div class="box">
    <h2>My To-Do List</h2>
    <div class="entry">
      <input type="text" id="taskInput" placeholder="Enter a task">
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskText = input.value.trim();

      if (taskText === "") {
        alert("Please enter a task.");
        return;
      }

      const li = document.createElement("li");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.setAttribute("aria-label", "Mark task as completed");

      const span = document.createElement("span");
      span.textContent = taskText;

      // Mark the task as completed or incomplete.
      checkbox.addEventListener("change", function() {
        li.classList.toggle("completed", checkbox.checked);
      });

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.className = "delete";
      deleteButton.addEventListener("click", function() {
        li.remove();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteButton);
      document.getElementById("taskList").appendChild(li);

      input.value = "";
      input.focus();
    }

    // Allow the Enter key to add a task.
    document.getElementById("taskInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>
</body>
</html>
