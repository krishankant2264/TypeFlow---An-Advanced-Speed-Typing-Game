<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; display: grid; place-items: center; min-height: 100vh; }
    form { background: white; padding: 25px; width: min(90%, 360px); border-radius: 12px; box-shadow: 0 4px 15px #0002; }
    input, button { width: 100%; padding: 11px; margin: 8px 0; box-sizing: border-box; }
    button { background: #1769aa; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #message { font-weight: bold; }
  </style>
</head>
<body>
  <form id="signupForm">
    <h2>Create an Account</h2>
    <label for="name">Full name</label>
    <input id="name" type="text" placeholder="Your name" required minlength="2">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="name@example.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="At least 8 characters" required minlength="8">
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" placeholder="Enter password again" required>
    <button type="submit">Sign Up</button>
    <p id="message" aria-live="polite"></p>
  </form>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      // Check the browser's built-in required, email and minlength rules.
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "red";
        return;
      }

      message.textContent = "Signup form submitted successfully!";
      message.style.color = "green";
      form.reset();
    });
  </script>
</body>
</html>
